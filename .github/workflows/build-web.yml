# ─────────────────────────────────────────────────────────────────────────────
# Build and deploy the Web version using Expo Web export
# ─────────────────────────────────────────────────────────────────────────────
name: Build – Web

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach assets to (e.g. v0.1.3)"
        required: false
        default: ""

permissions:
  contents: write          # attach release assets on tag builds
  pages: write
  id-token: write

env:
  WORKING_DIR: mobile

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure API URL
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL || 'https://api.kjbllm.app' }}" >> $GITHUB_ENV

      - name: Export static web build
        run: npx expo export --platform web

      - name: Upload artifact (Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

      - name: Upload artifact (general)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: mobile/dist

      # ChromeOS gets the same web build plus ChromeOS install instructions
      - name: Package ChromeOS zip
        run: |
          rm -rf chromeos-stage
          mkdir -p chromeos-stage
          cp -r dist/. chromeos-stage/
          printf '%s\n' \
            '# KJB-LLM — ChromeOS' \
            '' \
            '## Easiest: install the web app (PWA)' \
            '' \
            '1. Open https://socrtwo.github.io/kjb-llm-King-James-Bible-Large-Language-Model-/ in Chrome on your Chromebook.' \
            '2. Click the install icon in the address bar ("Install app").' \
            '3. The app appears in the ChromeOS launcher — pin it to the shelf if you like.' \
            '' \
            '## Or: run the Linux desktop build' \
            '' \
            'If your Chromebook has Linux (Crostini) enabled (Settings -> About ChromeOS -> Linux development environment):' \
            '' \
            '1. Download the .deb from this same release page and double-click it in the Files app to install.' \
            '2. Or download the .AppImage, then in the Linux terminal run: chmod +x KJB-LLM-*.AppImage && ./KJB-LLM-*.AppImage' \
            '' \
            '## Offline / self-hosted' \
            '' \
            '- This zip contains the same static web build the hosted page serves. Host the folder on any static web server.' \
            > chromeos-stage/INSTALL.md
          ( cd chromeos-stage && zip -qr ../KJB-LLM-chromeos.zip . )
          ls -la KJB-LLM-chromeos.zip

      - name: Attach ChromeOS zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            mobile/KJB-LLM-chromeos.zip

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
