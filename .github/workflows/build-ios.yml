# ─────────────────────────────────────────────────────────────────────────────
# Build iOS IPA using Expo / EAS Build
# ─────────────────────────────────────────────────────────────────────────────
name: Build – iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      tag:
        description: "Release tag to create/attach assets to (e.g. v0.1.3)"
        required: false
        default: ""

permissions:
  contents: write

env:
  WORKING_DIR: mobile

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure API URL
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL || 'https://api.kjbllm.app' }}" >> $GITHUB_ENV

      # eas build --local requires an EAS project id ('eas init'), which this
      # project does not have. Prebuild + xcodebuild needs no Expo account;
      # the unsigned simulator app is packaged as a tar.gz.
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build simulator app (unsigned)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          tar -czf KJB-LLM-ios-simulator.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            mobile/*.ipa
            mobile/*.tar.gz

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            mobile/*.ipa
            mobile/*.tar.gz
