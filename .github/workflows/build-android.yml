# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK using Expo / EAS Build
# ─────────────────────────────────────────────────────────────────────────────
name: Build – Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      tag:
        description: "Release tag to create/attach assets to (e.g. v0.1.3)"
        required: false
        default: ""

permissions:
  contents: write          # needed to upload release assets

env:
  WORKING_DIR: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure API URL
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL || 'https://api.kjbllm.app' }}" >> $GITHUB_ENV

      # eas build --local requires an EAS project id ('eas init'), which this
      # project does not have. Prebuild + Gradle needs no Expo account.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.kotlinVersion=1.9.25
          cp app/build/outputs/apk/debug/app-debug.apk ../KJB-LLM-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            mobile/*.apk
            mobile/*.aab

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            mobile/*.apk
            mobile/*.aab
