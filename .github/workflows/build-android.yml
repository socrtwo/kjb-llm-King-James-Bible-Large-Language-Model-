# ─────────────────────────────────────────────────────────────────────────────
# Build Android APK using Expo / EAS Build
# ─────────────────────────────────────────────────────────────────────────────
name: Build – Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      tag:
        description: "Release tag to create/attach assets to (e.g. v0.1.3)"
        required: false
        default: ""

permissions:
  contents: write          # needed to upload release assets

env:
  WORKING_DIR: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure API URL
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL || 'https://api.kjbllm.app' }}" >> $GITHUB_ENV

      - name: Build Android APK (preview)
        if: ${{ github.event.inputs.profile != 'production' }}
        run: eas build --platform android --profile preview --non-interactive --local
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1

      - name: Build Android AAB (production)
        if: ${{ github.event.inputs.profile == 'production' }}
        run: eas build --platform android --profile production --non-interactive --local
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            mobile/*.apk
            mobile/*.aab

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            mobile/*.apk
            mobile/*.aab
